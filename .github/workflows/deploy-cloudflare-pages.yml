name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Pages project when absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/101-challenging-math-word-problems"
          projects_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          bucket_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/math-word-problem-resources"
          buckets_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$project_url")"

          case "$status" in
            200)
              echo "Cloudflare Pages project already exists."
              ;;
            404)
              curl --fail-with-body --request POST "$projects_url" \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header "Content-Type: application/json" \
                --data '{"name":"101-challenging-math-word-problems","production_branch":"main"}'
              ;;
            *)
              echo "Unable to check the Cloudflare Pages project (HTTP $status)." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$bucket_url")"

          case "$status" in
            200)
              echo "Cloudflare R2 bucket already exists."
              ;;
            404)
              curl --fail-with-body --request POST "$buckets_url" \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header "Content-Type: application/json" \
                --data '{"name":"math-word-problem-resources"}'
              ;;
            *)
              echo "Unable to check the Cloudflare R2 bucket (HTTP $status)." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Upload oversized resources to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          find resources -type f -size +25M -print0 |
            while IFS= read -r -d '' file; do
              npx --yes wrangler@4.127.1 r2 object put "math-word-problem-resources/${file}" \
                --file="$file" \
                --content-type="application/pdf" \
                --remote
            done

      - name: Prepare Pages assets
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=.cloudflare-pages \
            --exclude='resources/book-*/supporting-materials/reference-images/' \
            ./ .cloudflare-pages/
          find .cloudflare-pages -type f -size +25M -delete

      - name: Deploy static site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: pages deploy .cloudflare-pages --project-name=101-challenging-math-word-problems --branch=main
